[project]
name = "ager-translators"
version = "0.1.0"
description = "Compile AGER / OKF agent graphs into LangGraph, CrewAI, Claude, Deep Agents, and host plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spillwave Solutions" }]
dependencies = []

[project.scripts]
ager-compile = "ager_translators.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
